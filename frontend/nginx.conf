server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Aktifkan range requests global (dibutuhkan untuk seek video)
    sendfile on;
    tcp_nopush on;

    # Routing SPA React — semua 404 redirect ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── WebSocket /api/ws/* → backend (HARUS sebelum /api/ biasa) ──────────
    location /api/ws/ {
        proxy_pass         http://backend:8000/ws/;
        proxy_http_version 1.1;

        # Header wajib untuk upgrade ke WebSocket
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Timeout panjang — koneksi WS bisa hidup lama
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout 30s;
    }

    # ── REST API /api/* → backend FastAPI ──────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Penting: teruskan header Range dari browser agar video bisa di-seek
        proxy_set_header   Range             $http_range;
        proxy_set_header   If-Range          $http_if_range;

        # Timeout panjang — analisis sinkron bisa butuh menit
        proxy_read_timeout    600s;
        proxy_connect_timeout 30s;
        proxy_send_timeout    600s;

        # Ukuran upload video
        client_max_body_size 500M;
    }
}
